<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460" fill="none">
  <defs>
    <!-- Soft Contact Shadow -->
    <radialGradient id="cx-ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B192C" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0B192C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B192C" stop-opacity="0"/>
    </radialGradient>

    <!-- Smoke Detector Gradients -->
    <radialGradient id="detector-base" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="85%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>

    <radialGradient id="detector-inner" cx="44%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <linearGradient id="chamber-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="detector-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Fire Strobe Horn Gradients -->
    <linearGradient id="strobe-housing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="35%" stop-color="#DC2626"/>
      <stop offset="75%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <linearGradient id="strobe-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="strobe-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>

    <!-- Filter for 3D Element Drop Shadow -->
    <filter id="cx-element-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="16" stdDeviation="14" flood-color="#0B192C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Grounding Soft Shadows -->
  <ellipse cx="210" cy="405" rx="160" ry="26" fill="url(#cx-ground-shadow)"/>
  <ellipse cx="405" cy="410" rx="90" ry="20" fill="url(#cx-ground-shadow)"/>

  <!-- ==============================================
       1. COMMERCIAL SMOKE DETECTOR (MAIN UNIT)
       ============================================== -->
  <g filter="url(#cx-element-shadow)">
    <!-- Base Mounting Trim -->
    <ellipse cx="210" cy="245" rx="162" ry="136" fill="url(#detector-rim)"/>
    <ellipse cx="210" cy="243" rx="158" ry="132" fill="#E2E8F0"/>
    <ellipse cx="210" cy="240" rx="154" ry="128" fill="url(#detector-base)"/>

    <!-- Optical Chamber Outer Slit Trench (Black acoustic ring) -->
    <ellipse cx="210" cy="238" rx="122" ry="100" fill="url(#chamber-ring)"/>

    <!-- Chamber Grill Slits Pattern -->
    <ellipse cx="210" cy="238" rx="114" ry="94" fill="none" stroke="#64748B" stroke-width="5" stroke-dasharray="10 8"/>

    <!-- Raised Smoke Ingress Chamber Dome -->
    <ellipse cx="210" cy="234" rx="98" ry="80" fill="url(#detector-inner)"/>
    <ellipse cx="210" cy="234" rx="98" ry="80" fill="none" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Micro-groove circular vents -->
    <ellipse cx="210" cy="232" rx="72" ry="58" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <ellipse cx="210" cy="230" rx="50" ry="40" fill="url(#detector-base)"/>

    <!-- Test / Hush Center Button -->
    <ellipse cx="210" cy="226" rx="30" ry="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="210" cy="225" rx="24" ry="19" fill="#F8FAFC"/>
    <text x="210" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">TEST</text>

    <!-- Dual Status LEDs (Green Normal / Red Alarm Halo) -->
    <!-- LED 1: Status (Green pulse) -->
    <ellipse cx="180" cy="214" rx="7" ry="5.5" fill="#10B981"/>
    <ellipse cx="179" cy="213" rx="3.5" ry="2.5" fill="#A7F3D0"/>
    <circle cx="180" cy="214" r="11" fill="#10B981" opacity="0.25"/>

    <!-- LED 2: Alarm Indicator (Red accent) -->
    <ellipse cx="240" cy="214" rx="7" ry="5.5" fill="#EF4444"/>
    <ellipse cx="239" cy="213" rx="3.5" ry="2.5" fill="#FECACA"/>

    <!-- Brand / Spec Micro-labels -->
    <text x="210" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">CAMNEX FIRE SENSOR</text>
    <text x="210" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="1">PHOTOELECTRIC • EN54-7</text>
  </g>

  <!-- ==============================================
       2. COMMERCIAL FIRE STROBE HORN / SIREN UNIT
       ============================================== -->
  <g filter="url(#cx-element-shadow)">
    <!-- Main Red Housing Box -->
    <rect x="345" y="150" width="138" height="196" rx="20" fill="url(#strobe-housing)"/>
    <!-- Housing Bevel Highlight Line -->
    <rect x="347" y="152" width="134" height="192" rx="18" fill="none" stroke="#FCA5A5" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Top Recessed Bezel for Xenon Strobe Flash Lens -->
    <rect x="362" y="170" width="104" height="66" rx="10" fill="url(#strobe-bezel)"/>
    <!-- Prismatic Fresnel Strobe Lens -->
    <rect x="365" y="173" width="98" height="60" rx="8" fill="url(#strobe-lens)"/>

    <!-- Fresnel Horizontal Fluting Lines -->
    <line x1="367" y1="183" x2="461" y2="183" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="367" y1="193" x2="461" y2="193" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="367" y1="203" x2="461" y2="203" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="367" y1="213" x2="461" y2="213" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="367" y1="223" x2="461" y2="223" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75"/>

    <!-- Lens Center Flash Core -->
    <circle cx="414" cy="203" r="14" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="414" cy="203" r="22" fill="#FEF08A" opacity="0.4"/>

    <!-- Bold High-Contrast "FIRE" Typography -->
    <text x="414" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">FIRE</text>

    <!-- Acoustic Sounder Grille / Siren Louver Slots -->
    <g stroke="#7F1D1D" stroke-width="3" stroke-linecap="round">
      <line x1="384" y1="294" x2="444" y2="294"/>
      <line x1="390" y1="304" x2="438" y2="304"/>
      <line x1="396" y1="314" x2="432" y2="314"/>
    </g>

    <text x="414" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" fill="#FECACA" text-anchor="middle" letter-spacing="1">105dB ALARM</text>
  </g>
</svg>
