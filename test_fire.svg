<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'>
  <defs>
    <radialGradient id='smoke-grad' cx='45%' cy='40%' r='60%'>
      <stop offset='0%' stop-color='#FFFFFF'/>
      <stop offset='60%' stop-color='#E2E8F0'/>
      <stop offset='100%' stop-color='#CBD5E1'/>
    </radialGradient>
    <linearGradient id='red-strobe' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#EF4444'/>
      <stop offset='50%' stop-color='#DC2626'/>
      <stop offset='100%' stop-color='#991B1B'/>
    </linearGradient>
    <linearGradient id='strobe-lens' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#FFFFFF' stop-opacity='0.9'/>
      <stop offset='30%' stop-color='#FEF3C7' stop-opacity='0.8'/>
      <stop offset='70%' stop-color='#F59E0B' stop-opacity='0.7'/>
      <stop offset='100%' stop-color='#DC2626' stop-opacity='0.85'/>
    </linearGradient>
    <filter id='drop-shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='16' stdDeviation='18' flood-color='#0B192C' flood-opacity='0.18'/>
    </filter>
  </defs>
  <!-- Smoke Detector Base -->
  <g filter='url(#drop-shadow)'>
    <!-- Outer mounting ring -->
    <ellipse cx='260' cy='280' rx='180' ry='150' fill='#F1F5F9' stroke='#CBD5E1' stroke-width='4'/>
    <!-- Main detector disc -->
    <ellipse cx='260' cy='275' rx='160' ry='135' fill='url(#smoke-grad)' stroke='#E2E8F0' stroke-width='3'/>
    <!-- Chamber vents ring -->
    <ellipse cx='260' cy='275' rx='120' ry='100' fill='none' stroke='#94A3B8' stroke-width='8' stroke-dasharray='12 8'/>
    <ellipse cx='260' cy='275' rx='105' ry='88' fill='#F8FAFC' stroke='#CBD5E1' stroke-width='2'/>
    <!-- Center sensor cap -->
    <ellipse cx='260' cy='275' rx='60' ry='50' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='3'/>
    <!-- Status LED & Test Button -->
    <circle cx='260' cy='270' r='12' fill='#10B981'/>
    <circle cx='260' cy='270' r='5' fill='#A7F3D0'/>
    <text x='260' y='305' font-family='sans-serif' font-size='10' font-weight='bold' fill='#64748B' text-anchor='middle' letter-spacing='1'>TEST / RESET</text>
  </g>
  <!-- Strobe Siren Horn Unit -->
  <g filter='url(#drop-shadow)'>
    <rect x='370' y='220' width='150' height='200' rx='20' fill='url(#red-strobe)' stroke='#B91C1C' stroke-width='3'/>
    <!-- Wall mount bevel -->
    <rect x='385' y='235' width='120' height='170' rx='12' fill='#B91C1C' opacity='0.3'/>
    <!-- Strobe Flash Lens -->
    <rect x='395' y='250' width='100' height='75' rx='10' fill='url(#strobe-lens)' stroke='#FCD34D' stroke-width='2'/>
    <!-- Strobe Fluting Lines -->
    <line x1='410' y1='252' x2='410' y2='323' stroke='#FFFFFF' stroke-width='2' opacity='0.7'/>
    <line x1='425' y1='252' x2='425' y2='323' stroke='#FFFFFF' stroke-width='2' opacity='0.7'/>
    <line x1='445' y1='252' x2='445' y2='323' stroke='#FFFFFF' stroke-width='2' opacity='0.7'/>
    <line x1='465' y1='252' x2='465' y2='323' stroke='#FFFFFF' stroke-width='2' opacity='0.7'/>
    <line x1='480' y1='252' x2='480' y2='323' stroke='#FFFFFF' stroke-width='2' opacity='0.7'/>
    <!-- FIRE text -->
    <text x='445' y='365' font-family='sans-serif' font-size='22' font-weight='900' fill='#FFFFFF' text-anchor='middle' letter-spacing='3'>FIRE</text>
    <!-- Siren Sounder Slits -->
    <line x1='415' y1='385' x2='475' y2='385' stroke='#7F1D1D' stroke-width='3' stroke-linecap='round'/>
    <line x1='420' y1='395' x2='470' y2='395' stroke='#7F1D1D' stroke-width='3' stroke-linecap='round'/>
  </g>
</svg>