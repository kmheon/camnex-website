<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamneX Category Card - Final Polish</title>
    <link rel="stylesheet" href="category-card.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="container cx-demo">
    <div class="cx-category-grid">

        <!-- Category Card (WooCommerce Ready) -->
        <article class="cx-category-card" 
                 data-category-id="12" 
                 data-category-name="Security & Surveillance"
                 data-tagline="Professional Security Solutions"
                 data-product-count="124"
                 data-category-url="/category/security-surveillance"
                 data-badge-type="featured">
            
            <div class="cx-category-media">
                <div class="cx-category-overlay" aria-hidden="true"></div>
                <span class="cx-category-badge featured">Featured</span>
                
                <img class="cx-category-img" 
                     src="../../assets/placeholders/security-installation.jpg" 
                     alt="Professional Security & Surveillance Installations" 
                     loading="lazy" 
                     decoding="async">
            </div>

            <div class="cx-category-content">
                <h3 class="cx-category-title">Security & Surveillance</h3>
                <p class="cx-category-tagline">Professional Security Solutions</p>
                <span class="cx-product-count-chip" aria-label="124 Products available">124 Products</span>
            </div>

            <div class="cx-category-footer">
                <a href="/category/security-surveillance" class="cx-category-btn" aria-label="Browse Security & Surveillance Category">
                    Browse Category
                    <i data-lucide="arrow-right" aria-hidden="true"></i>
                </a>
            </div>

        </article>

    </div>
</div>

<script src="category-card.js"></script>

</body>
</html>
