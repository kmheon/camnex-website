<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CamneX Button System</title>

    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/typography.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">

    <link rel="stylesheet" href="button.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="container" style="padding:60px 0;">

    <h1>Button System</h1>

    <br><br>

    <h3>Primary</h3>

    <br>

    <button class="cx-btn cx-btn-primary cx-btn-md">

        <i data-lucide="shopping-cart"></i>

        Shop Now

    </button>

    <button class="cx-btn cx-btn-primary cx-btn-sm">

        Small

    </button>

    <button class="cx-btn cx-btn-primary cx-btn-lg">

        Large Button

    </button>

    <br><br><br>

    <h3>Outline</h3>

    <br>

    <button class="cx-btn cx-btn-outline">

        <i data-lucide="phone"></i>

        Contact Sales

    </button>

    <button class="cx-btn cx-btn-outline">

        <i data-lucide="message-circle"></i>

        WhatsApp

    </button>

    <br><br><br>

    <h3>Secondary</h3>

    <br>

    <button class="cx-btn cx-btn-secondary">

        Learn More

    </button>

    <button class="cx-btn cx-btn-ghost">

        Ghost

    </button>

    <br><br><br>

    <h3>Success & Danger</h3>

    <br>

    <button class="cx-btn cx-btn-success">

        Completed

    </button>

    <button class="cx-btn cx-btn-danger">

        Delete

    </button>

    <br><br><br>

    <h3>Icon Button</h3>

    <br>

    <button class="cx-btn cx-btn-outline cx-btn-icon">

        <i data-lucide="search"></i>

    </button>

    <button class="cx-btn cx-btn-outline cx-btn-icon">

        <i data-lucide="heart"></i>

    </button>

    <button class="cx-btn cx-btn-outline cx-btn-icon">

        <i data-lucide="user"></i>

    </button>

    <button class="cx-btn cx-btn-outline cx-btn-icon">

        <i data-lucide="shopping-cart"></i>

    </button>

    <br><br><br>

    <h3>Loading</h3>

    <br>

    <button class="cx-btn cx-btn-primary cx-btn-loading">

        <span class="cx-btn-spinner"></span>

        Loading...

    </button>

    <br><br><br>

    <h3>Disabled</h3>

    <br>

    <button class="cx-btn cx-btn-primary" disabled>

        Disabled

    </button>

    <button class="cx-btn cx-btn-outline" disabled>

        Disabled

    </button>

    <br><br><br>

    <h3>Full Width</h3>

    <br>

    <button class="cx-btn cx-btn-primary cx-btn-block">

        Continue

    </button>

</div>

<script>

lucide.createIcons();

</script>

</body>

</html>
