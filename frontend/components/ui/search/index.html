<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CamneX Search System</title>

    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/typography.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">

    <link rel="stylesheet" href="search.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="container" style="padding:60px 0;max-width:900px;">

    <h1>Search System</h1>

    <br><br>

    <div class="cx-search" id="searchComponent">

        <div class="cx-search-box">

            <div class="cx-search-icon">

                <i data-lucide="search"></i>

            </div>

            <input
                class="cx-search-input"
                type="search"
                placeholder="Search cameras, NVRs, networking, brands...">

            <button class="cx-search-button">

                <i data-lucide="arrow-right"></i>

            </button>

        </div>

        <div class="cx-search-dropdown">

            <div class="cx-search-item">

                <div class="cx-search-thumb"></div>

                <div class="cx-search-info">

                    <div class="cx-search-title">

                        Hikvision DS-2CE16D0T-IRPF(C)

                    </div>

                    <div class="cx-search-brand">

                        Hikvision • CCTV Camera

                    </div>

                </div>

                <div class="cx-search-price">

                    ৳2,150

                </div>

            </div>

            <div class="cx-search-item">

                <div class="cx-search-thumb"></div>

                <div class="cx-search-info">

                    <div class="cx-search-title">

                        Dahua Hero A1 5MP WiFi Camera

                    </div>

                    <div class="cx-search-brand">

                        Dahua • WiFi Camera

                    </div>

                </div>

                <div class="cx-search-price">

                    ৳4,250

                </div>

            </div>

            <div class="cx-search-item">

                <div class="cx-search-thumb"></div>

                <div class="cx-search-info">

                    <div class="cx-search-title">

                        MikroTik hAP ax3

                    </div>

                    <div class="cx-search-brand">

                        MikroTik • Router

                    </div>

                </div>

                <div class="cx-search-price">

                    ৳12,500

                </div>

            </div>

        </div>

    </div>

</div>

<script src="search.js"></script>

<script>

lucide.createIcons();

</script>

</body>

</html>
