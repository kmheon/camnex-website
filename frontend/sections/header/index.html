<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CamneX Header</title>

    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/typography.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="../../shared/css/utilities.css">
    <link rel="stylesheet" href="../../shared/css/icons.css">
    <link rel="stylesheet" href="header.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<header class="cx-header">

    <div class="cx-topbar">

        <div class="container">

            <div class="cx-topbar-left">

                <a href="#">

                    <i data-lucide="truck"></i>

                    Nationwide Delivery

                </a>

                <a href="#">

                    <i data-lucide="shield-check"></i>

                    Official Warranty

                </a>

            </div>

            <div class="cx-topbar-right">

                <a href="#">

                    <i data-lucide="package-search"></i>

                    Track Order

                </a>

                <a href="#">

                    <i data-lucide="map-pinned"></i>

                    Track Shipment

                </a>

            </div>

        </div>

    </div>

    <div class="cx-main-header">

        <div class="container">

            <a href="#" class="cx-logo">

                <img src="../../shared/assets/logos/logo-placeholder.svg">

            </a>

            <div class="cx-search">

                <form>

                    <input
                        type="text"
                        placeholder="Search products...">

                    <button>

                        <i data-lucide="search"></i>

                    </button>

                </form>

            </div>

            <div class="cx-actions">

                <a href="#" class="cx-action">

                    <i data-lucide="phone"></i>

                </a>

                <a href="#" class="cx-action">

                    <i data-lucide="heart"></i>

                </a>

                <a href="#" class="cx-action">

                    <i data-lucide="user"></i>

                </a>

                <a href="#" class="cx-action">

                    <i data-lucide="shopping-cart"></i>

                </a>

            </div>

        </div>

    </div>

    <nav class="cx-nav">

        <div class="container">

            <a href="#">Solutions</a>

            <a href="#">Products</a>

            <a href="#">Bundles</a>

            <a href="#">Projects</a>

            <a href="#">Brands</a>

            <a href="#">Support</a>

            <a href="#">Contact</a>

        </div>

    </nav>

</header>

<script>

lucide.createIcons();

</script>

</body>

</html>
