<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamneX — Featured CCTV Packages</title>
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="featured-packages.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<section class="cx-featured-packages-section" aria-labelledby="packages-section-title">
    <div class="cx-packages-bg-glow" aria-hidden="true"></div>
    
    <div class="container cx-packages-container">
        
        <!-- Section Header with Carousel Navigation Controls -->
        <div class="cx-packages-header">
            <div class="cx-header-text-block">
                <div class="cx-section-eyebrow">
                    <span class="cx-eyebrow-line"></span>
                    <span>FEATURED CCTV PACKAGES</span>
                    <span class="cx-eyebrow-line"></span>
                </div>
                
                <h2 id="packages-section-title" class="cx-section-heading">
                    Professional CCTV Packages Ready for Installation
                </h2>
                
                <p class="cx-section-desc">
                    Choose complete surveillance solutions for homes, shops, offices and enterprises with professional installation across Bangladesh.
                </p>
            </div>

            <!-- Carousel Navigation Arrows -->
            <div class="cx-carousel-controls">
                <button type="button" class="cx-carousel-btn cx-btn-prev" id="prevPackageBtn" aria-label="Previous packages">
                    <i data-lucide="chevron-left"></i>
                </button>
                <button type="button" class="cx-carousel-btn cx-btn-next" id="nextPackageBtn" aria-label="Next packages">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Horizontal Product Showcase Carousel Track -->
        <div class="cx-packages-carousel-viewport">
            <div class="cx-packages-track" id="packagesTrack">
                <!-- Dynamically rendered via JavaScript data array -->
            </div>
        </div>

        <!-- Carousel Pagination Dots -->
        <div class="cx-carousel-dots" id="carouselDots" role="tablist" aria-label="Carousel Pagination"></div>

    </div>
</section>

<script src="featured-packages.js"></script>

</body>
</html>
