<section class="cx-editorial-showcase" aria-labelledby="showcase-title">
    <div class="container cx-showcase-container">
        
        <!-- Section Header & Editorial Filter Bar -->
        <div class="cx-showcase-header">
            <div class="cx-header-text">
                <div class="cx-eyebrow">
                    <span class="cx-eyebrow-dash"></span>
                    <span>CURATED HARDWARE</span>
                </div>
                <h2 id="showcase-title" class="cx-showcase-heading">
                    Enterprise Intelligence, Masterfully Crafted.
                </h2>
                <p class="cx-showcase-desc">
                    Explore high-performance surveillance and networking architecture designed for mission-critical deployments.
                </p>
            </div>

            <!-- Dynamic Editorial Filter Pills -->
            <div class="cx-editorial-filters" id="editorialFilters" role="tablist" aria-label="Hardware Categories">
                <!-- Dynamically rendered via data.js -->
            </div>
        </div>

        <!-- Editorial Asymmetrical Bento Grid Workspace -->
        <div class="cx-editorial-bento" id="editorialBento">
            <!-- Dynamically rendered via script.js -->
        </div>

    </div>
</section>

<!-- Quick View Modal Container -->
<div class="cx-quickview-modal" id="quickViewModal" aria-hidden="true">
    <div class="cx-modal-backdrop" id="modalBackdrop"></div>
    <div class="cx-modal-content-wrapper" id="modalContent">
        <!-- Injected dynamically -->
    </div>
</div>
