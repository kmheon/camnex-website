<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamneX — Security & Intelligence</title>
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="hero.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<section class="cx-weverly-image-hero" aria-labelledby="bannerHeadline">
    <div class="container cx-hero-container">

        <!-- Large Immersive Banner with Complete Product Showcase & Dynamic Watermark -->
        <div class="cx-image-banner" id="imageBanner">

            <!-- Background Product Image Layer -->
            <div class="cx-banner-bg-layer">
                <img id="bannerBgImg" src="" alt="Product Showcase">
                <div class="cx-banner-dark-overlay"></div>
            </div>

            <!-- Content Area -->
            <div class="cx-image-content-layer">
                <div class="cx-banner-top-left">
                    <span class="cx-banner-eyebrow">Trusted Security Partner</span>
                    <p class="cx-banner-top-desc" id="bannerTopDesc"></p>
                </div>

                <div class="cx-banner-center-main">
                    <h1 id="bannerHeadline" class="cx-banner-headline"></h1>
                </div>

                <div class="cx-banner-bottom-info">
                    <p class="cx-banner-subtext" id="bannerSubtext"></p>
                    <div class="cx-banner-watermark" id="bannerWatermark">CCTV</div>
                </div>
            </div>

            <!-- Bottom Integrated Navigation Tabs Bar
                 Buttons are generated by hero.js from the slide data itself,
                 so the tabs can never fall out of sync with slide content again. -->
            <div class="cx-banner-bottom-tabs" id="heroTabsBar" role="tablist" aria-label="Solution Switcher"></div>
        </div>

        <!-- Bottom Partner Logo Strip (Transparent background & Corrected 'Dahua' spelling) -->
        <div class="cx-image-logo-strip" role="region" aria-label="Authorized Partner Brands">
            <div class="cx-brand-badge brand-hikvision">HIKVISION</div>
            <div class="cx-brand-badge brand-dahua">Dahua</div>
            <div class="cx-brand-badge brand-ezviz">EZVIZ</div>
            <div class="cx-brand-badge brand-ruijie">RUIJIE</div>
            <div class="cx-brand-badge brand-tplink">tp-link</div>
            <div class="cx-brand-badge brand-mikrotik">MikroTik</div>
        </div>

    </div>
</section>

<script src="hero.js"></script>

</body>
</html>
