<!-- CamneX Bangladesh — Premium Product-First Launch Hero -->
<section class="cx-hero" id="camnexHero" aria-label="Featured Technology Products">
    <div class="container cx-hero-container">

        <!-- Product Launch Stage Card -->
        <div class="cx-hero-card" id="heroProductStage">

            <!-- LEFT: Product Story & Actions -->
            <div class="cx-hero-content">

                <!-- Eyebrow Tag -->
                <div class="cx-hero-eyebrow">
                    <span class="cx-hero-badge" id="heroBadge">NEW ARRIVAL</span>
                    <span class="cx-hero-category" id="heroCategory">CCTV &amp; Video Surveillance</span>
                </div>

                <!-- Product Headline (Meet the New ...) -->
                <div class="cx-hero-headline-group">
                    <span class="cx-hero-pretitle" id="heroPretitle">Meet the New</span>
                    <h1 class="cx-hero-title" id="heroTitle">Hikvision ColorVu Camera</h1>
                </div>

                <!-- Short Product Description -->
                <p class="cx-hero-desc" id="heroDesc">
                    Advanced color night vision, AI detection and reliable 24/7 surveillance for modern security.
                </p>

                <!-- Primary & Secondary CTAs -->
                <div class="cx-hero-actions">
                    <a href="/category/cctv-cameras" class="cx-btn-hero cx-btn-primary" id="heroPrimaryCta">
                        <span id="heroPrimaryCtaText">View Product</span>
                        <svg class="cx-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                    </a>
                    <a href="/get-quote" class="cx-btn-hero cx-btn-secondary" id="heroSecondaryCta">
                        <span>Get a Quote</span>
                    </a>
                </div>

            </div>

            <!-- CENTER: Large Product Image Showcase -->
            <div class="cx-hero-visual">
                <div class="cx-visual-aura" aria-hidden="true"></div>
                <div class="cx-visual-frame" id="heroVisualFrame">
                    <img id="heroProductImg"
                         class="cx-hero-image"
                         src="../../assets/products/cctv-bullet-transparent.png"
                         alt="Hikvision ColorVu Camera"
                         loading="eager" />
                </div>
            </div>

            <!-- RIGHT: Compact Vertical Speciality Rail -->
            <aside class="cx-hero-specs-rail" id="heroSpecsRail" aria-label="Key Product Specifications">
                <div class="cx-spec-rail-item">
                    <div class="cx-spec-rail-head">
                        <span class="cx-spec-dot" aria-hidden="true">●</span>
                        <span class="cx-spec-rail-val" id="specVal0">2MP</span>
                    </div>
                    <span class="cx-spec-rail-lbl" id="specLbl0">Resolution</span>
                </div>
                <div class="cx-spec-rail-item">
                    <div class="cx-spec-rail-head">
                        <span class="cx-spec-dot" aria-hidden="true">●</span>
                        <span class="cx-spec-rail-val" id="specVal1">ColorVu</span>
                    </div>
                    <span class="cx-spec-rail-lbl" id="specLbl1">Night Vision</span>
                </div>
                <div class="cx-spec-rail-item">
                    <div class="cx-spec-rail-head">
                        <span class="cx-spec-dot" aria-hidden="true">●</span>
                        <span class="cx-spec-rail-val" id="specVal2">AI Detection</span>
                    </div>
                    <span class="cx-spec-rail-lbl" id="specLbl2">Smart Analytics</span>
                </div>
                <div class="cx-spec-rail-item">
                    <div class="cx-spec-rail-head">
                        <span class="cx-spec-dot" aria-hidden="true">●</span>
                        <span class="cx-spec-rail-val" id="specVal3">30m</span>
                    </div>
                    <span class="cx-spec-rail-lbl" id="specLbl3">IR Range</span>
                </div>
            </aside>

            <!-- Bottom: Minimalist Product Carousel Switcher -->
            <div class="cx-hero-nav" role="tablist" aria-label="Featured Product Showcase Selector">
                <button type="button" class="cx-hero-nav-btn active" role="tab" id="prodTab0" aria-selected="true" data-index="0" aria-label="Product 1: Hikvision ColorVu Camera">
                    <span class="cx-nav-num">01</span>
                    <span class="cx-nav-title">ColorVu Camera</span>
                </button>
                <button type="button" class="cx-hero-nav-btn" role="tab" id="prodTab1" aria-selected="false" data-index="1" aria-label="Product 2: Face Recognition Terminal">
                    <span class="cx-nav-num">02</span>
                    <span class="cx-nav-title">Biometric Terminal</span>
                </button>
                <button type="button" class="cx-hero-nav-btn" role="tab" id="prodTab2" aria-selected="false" data-index="2" aria-label="Product 3: Reyee Cloud PoE Switch">
                    <span class="cx-nav-num">03</span>
                    <span class="cx-nav-title">Cloud PoE Switch</span>
                </button>
                <button type="button" class="cx-hero-nav-btn" role="tab" id="prodTab3" aria-selected="false" data-index="3" aria-label="Product 4: Smart Video Doorbell">
                    <span class="cx-nav-num">04</span>
                    <span class="cx-nav-title">Video Doorbell</span>
                </button>
            </div>

        </div>

    </div>
</section>
